name: Publish website
on:
  workflow_dispatch:
    inputs:
      tested_installer_sha256:
        description: SHA-256 of the installer downloaded from the public link and tested on Windows
        required: true
permissions: {}
concurrency:
  group: en-gym-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'petrovortex/En-GYM' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
      - name: Verify the official download and prepare the site
        run: node scripts/build-site.mjs
        env:
          TESTED_INSTALLER_SHA256: ${{ inputs.tested_installer_sha256 }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .work/pages
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
